ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # L'hébergeur termine le HTTPS et transmet la requête en HTTP : on le signale à l'application.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
