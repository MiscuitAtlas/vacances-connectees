<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-recherche.css">
    <link rel="icon" href="logo.jpg" type="image/x-icon">
    <title>Rechercher un Logement - VacancesConnectées</title>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="logo.jpg" alt="Logo VacancesConnectées" id="logo">
        </a>
        <h1>VacancesConnectées</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="recherche.html">Rechercher</a></li>
                <li><a href="proposer.html">Proposer un logement</a></li>
                <li><a href="compte.php">Mon Compte</a></li>
            </ul>
        </nav>
    </header>

    <section class="search-section">
        <h2>Trouvez Votre Logement de Vacances Idéal</h2>
        <form id="search-form" action="php-recherche.php" method="POST">
            <br>
            <div>
                <label for="destination">Localisation :</label>
                <input type="text" id="destination" name="destination" placeholder="Entrez une destination" required>
            </div>
            <div>
                <label for="check-in">Date d'arrivée :</label>
                <input type="date" id="check-in" name="check-in" required>
            </div>
            <div>
                <label for="check-out">Date de départ :</label>
                <input type="date" id="check-out" name="check-out" required>
            </div>
            <div>
                <label for="chambres">Nombre de chambres :</label>
                <select id="chambres" name="chambres" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div>
                <label for="personnes">Nombre de personnes :</label>
                <select id="personnes" name="personnes" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>  
            <br>
            <div>
                <label for="min-price">Prix minimum :</label>
                <input type="number" id="min-price" name="min-price" min="0" placeholder="Entrez un prix minimum" required>
            </div>
            <div>
                <label for="max-price">Prix maximum :</label>
                <input type="number" id="max-price" name="max-price" min="0" placeholder="Entrez un prix maximum" required>
            </div>
            <br>
            <button type="submit">Rechercher</button>
        </form>
    </section>    

    <br><br><br><br><br>
    <footer>
        <p>&copy; 2024 VacancesConnectées. Tous droits réservés.</p>
    </footer>
</body>
</html>
